# Generates the 3D contribution graph into profile-3d-contrib/
# Run once from Actions → GitHub-Profile-3D-Contrib → Run workflow
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib || true
          if git commit -m "chore: refresh 3d contribution graph"; then
            git push
          fi
